site_name: Bookwright
site_description: Toolkit de autoría spec-driven para novelas, ensayos y memorias.
docs_dir: docs

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - content.code.copy

# Warnings (broken links, orphan pages, missing nav targets) become build
# errors — this is the machine-checkable "zero warnings" gate (D7, FR-021).
strict: true

nav:
  - Inicio: index.md
  - Primeros pasos: getting-started.md
  - El flujo de autoría: authoring.md
  - Arquitectura: architecture.md
  - Comandos:
      - bookwright init: commands/init.md
      - bookwright check: commands/check.md
      - bookwright version: commands/version.md
      - bookwright validate: commands/validate.md
      - bookwright graph build: commands/graph-build.md
      - bookwright graph query: commands/graph-query.md
      - bookwright integration use: commands/integration-use.md
      - bookwright focus set: commands/focus-set.md
      - bookwright focus show: commands/focus-show.md
      - bookwright focus clear: commands/focus-clear.md
      - bookwright status: commands/status.md
  - Validación: validation.md
  - Estructura narrativa: narrative-structure.md
  - Investigación: research.md
  - Orquestación: orchestration.md
  - Extender: extending.md
  - Dogfooding: dogfooding.md
  - FAQ: faq.md
  - Cambios: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true
