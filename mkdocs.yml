site_name: Bookwright
site_description: Toolkit de autoría spec-driven para novelas, ensayos y memorias.
site_url: https://jmorenobl.github.io/bookwright/
docs_dir: docs

repo_url: https://github.com/jmorenobl/bookwright
repo_name: jmorenobl/bookwright

theme:
  name: material
  language: es
  icon:
    logo: material/feather
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    # Full nav tree always in the left sidebar (no top tabs) so the left column
    # is never empty — sections render as non-collapsible headers.
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - assets/extra.css

# Warnings (broken links, orphan pages, missing nav targets) become build
# errors — this is the machine-checkable "zero warnings" gate (D7, FR-021).
strict: true

nav:
  - Inicio: index.md
  - Tutorial:
      - tutorial/index.md
      - 1. Destila el canon: tutorial/distill.md
      - 2. Investiga los hechos: tutorial/research.md
      - 3. Estructura y redacta: tutorial/write.md
      - 4. Revisa y vuelve atrás: tutorial/revise.md
  - Conceptos:
      - concepts/index.md
      - Texto plano y grafo derivado: concepts/architecture.md
      - El loop de autoría y las skills: concepts/authoring.md
      - Investigación con procedencia: concepts/research.md
      - Estructura narrativa: concepts/narrative-structure.md
      - Orquestación de contexto: concepts/orchestration.md
  - Guías prácticas:
      - Interpretar la validación: guides/interpret-validation.md
      - Resolver pendientes [PENDING]: guides/pending.md
  - Referencia:
      - Validadores: validation.md
      - Extender (validador propio): extending.md
      - Comandos:
          - bookwright init: commands/init.md
          - bookwright check: commands/check.md
          - bookwright version: commands/version.md
          - bookwright validate: commands/validate.md
          - bookwright graph build: commands/graph-build.md
          - bookwright graph query: commands/graph-query.md
          - bookwright integration use: commands/integration-use.md
          - bookwright focus set: commands/focus-set.md
          - bookwright focus show: commands/focus-show.md
          - bookwright focus clear: commands/focus-clear.md
          - bookwright status: commands/status.md
  - Proyecto:
      - Cambios: changelog.md
      - FAQ: faq.md
      - Dogfooding: dogfooding.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
