[project]
name = "bookwright-cli"
dynamic = ["version"]
description = "Spec-driven authoring toolkit for novels, essays, and memoirs."
authors = [
    { name = "Jorge MB", email = "jmorenobl@gmail.com" }
]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
]
dependencies = [
    "jinja2>=3.1",
    "packaging>=23.0",
    "platformdirs>=4.2",
    "pydantic>=2.5",
    "python-slugify>=8.0",
    "pyyaml>=6.0",
    "rdflib>=7.0",
    "rich>=13.7",
    "tomlkit>=0.12",
    "typer>=0.12",
    "uuid-utils>=0.16",
]

[project.scripts]
bookwright = "bookwright.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/bookwright"]

[tool.hatch.build.targets.wheel]
packages = ["src/bookwright"]

[tool.hatch.build.targets.wheel.force-include]
"src/bookwright/resources" = "bookwright/resources"

[tool.hatch.version]
path = "src/bookwright/__init__.py"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "E731", "F841", "RUF005", "SIM108"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=bookwright --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["src/bookwright"]
branch = true
