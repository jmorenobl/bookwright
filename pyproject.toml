[project]
name = "bookwright-cli"
dynamic = ["version"]
description = "Spec-driven authoring toolkit for novels, essays, and memoirs."
readme = "README.md"
authors = [
    { name = "Jorge MB", email = "jmorenobl@gmail.com" }
]
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
]
dependencies = [
    "jinja2>=3.1",
    "packaging>=23.0",
    "platformdirs>=4.2",
    "pydantic>=2.5",
    "python-slugify>=8.0",
    "pyyaml>=6.0",
    "rdflib>=7.0",
    "rich>=13.7",
    "tomlkit>=0.12",
    "typer>=0.12",
    "uuid-utils>=0.16",
]

[project.urls]
Homepage = "https://github.com/jmorenobl/bookwright"
Repository = "https://github.com/jmorenobl/bookwright"
Issues = "https://github.com/jmorenobl/bookwright/issues"
Changelog = "https://github.com/jmorenobl/bookwright/blob/main/CHANGELOG.md"

[project.scripts]
bookwright = "bookwright.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/bookwright"]

[tool.hatch.build.targets.wheel]
# `packages` maps src/bookwright/** → bookwright/** and bundles the full tree,
# including the `resources/` data files (templates, commands, vocabularies,
# schemas) that `importlib.resources` reads at runtime. No separate
# force-include is needed — adding one duplicates `resources/` at the same
# archive path and breaks `uv build`.
packages = ["src/bookwright"]

[tool.hatch.version]
path = "src/bookwright/__init__.py"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20260518",
]
# Docs toolchain (D6): MkDocs is never imported by `src/` at runtime and never
# ships in the wheel, so it is a dev/docs tool — a dedicated group keeps the
# runtime dependency contract (Principle II) untouched, no amendment required.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "E731", "F841", "RUF005", "SIM108"]
# Verbatim bilingual ES/EN description data table mirroring the iteration-8
# source frontmatter under the SC-009 equality gate: the strings must stay
# byte-for-byte faithful, so long lines (E501) and Spanish typographic dashes
# (RUF001 EN DASH) are intentional and may not be rewrapped or transliterated.
"src/bookwright/integrations/descriptions.py" = ["E501", "RUF001"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Markers: `manual` is a packaged-install / subprocess smoke that is slow and
# network-dependent — deselected by default so the default run stays hermetic
# and the coverage gate measures only in-process code (R2/R3, D7).
markers = [
    "manual: packaged-install / subprocess smoke; opt-in via `-m manual` (not run by default).",
]
# The coverage gate threshold is single-sourced in [tool.coverage.report]
# (`fail_under = 80`, `precision = 2`); pytest-cov honors it, so we deliberately
# do NOT pass `--cov-fail-under` here — one threshold, no drift (CI-1, FR-019).
addopts = "-ra -m 'not manual' --cov=bookwright --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/bookwright"]
branch = true

[tool.coverage.report]
# Fail closed with no round-up: a precise 79.99% must not pass an "≥ 80%" gate.
# `precision = 2` makes coverage compare/report to two decimals so the threshold
# is never satisfied by rounding (Amendment B; FR-019, SC-005).
precision = 2
fail_under = 80
