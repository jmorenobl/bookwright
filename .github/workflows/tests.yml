name: CI

on:
  push: {}
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync deps (frozen)
        run: uv sync --frozen
      - name: Lint (ruff check)
        if: matrix.python-version == '3.12'
        run: uv run ruff check .
      - name: Format check (ruff format --check)
        if: matrix.python-version == '3.12'
        run: uv run ruff format --check .
      - name: Type check (mypy --strict)
        if: matrix.python-version == '3.12'
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Docs build (strict)
        if: matrix.python-version == '3.12'
        run: uv run --group docs mkdocs build --strict
      - name: Build distribution (wheel + sdist)
        if: matrix.python-version == '3.12'
        run: uv build
      - name: Assert wheel bundles packaged resources
        if: matrix.python-version == '3.12'
        run: python -m zipfile -l dist/bookwright_cli-*.whl | grep -q 'bookwright/resources/'
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
