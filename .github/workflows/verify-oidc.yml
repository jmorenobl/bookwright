name: Verify PyPI OIDC

# Non-destructive trusted-publishing check: mint a GitHub OIDC token (audience
# pypi) and exchange it at PyPI's mint-token endpoint. A returned ephemeral
# token proves the trusted publisher (owner/repo/workflow/environment) matches —
# nothing is uploaded. Run via: gh workflow run verify-oidc.yml
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Exchange OIDC token with PyPI
        run: |
          oidc="$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" | jq -r '.value')"
          resp="$(curl -sS -X POST https://pypi.org/_/oidc/mint-token \
            -d "{\"token\":\"$oidc\"}")"
          if echo "$resp" | jq -e '.token' >/dev/null 2>&1; then
            echo "OIDC OK — PyPI minted an ephemeral token; trusted publishing is configured correctly."
          else
            echo "OIDC FAILED — PyPI rejected the exchange:"
            echo "$resp" | jq . 2>/dev/null || echo "$resp"
            exit 1
          fi
