name: Verify PyPI OIDC

# Non-destructive trusted-publishing diagnostic. Mints a GitHub OIDC token
# (audience pypi), prints the exact claims GitHub presents (so you can compare
# them against PyPI's "Add a publisher" form), and attempts the mint-token
# exchange. NOTE: PyPI matches a publisher by *workflow filename*, so a publisher
# registered for release.yml will NOT match this file (verify-oidc.yml) — the
# claims print is the useful signal. Nothing is uploaded.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Mint OIDC token and show claims + exchange result
        run: |
          oidc="$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" | jq -r '.value')"
          echo "== Claims GitHub presents to PyPI =="
          echo "$oidc" | cut -d. -f2 | python3 -c "import sys,base64,json; s=sys.stdin.read().strip(); s+='='*(-len(s)%4); d=json.loads(base64.urlsafe_b64decode(s)); print(json.dumps({k:d.get(k) for k in ['repository','repository_owner','job_workflow_ref','ref','environment','aud']}, indent=2))"
          echo "== PyPI mint-token exchange =="
          resp="$(curl -sS -X POST https://pypi.org/_/oidc/mint-token \
            -d "{\"token\":\"$oidc\"}")"
          if echo "$resp" | jq -e '.token' >/dev/null 2>&1; then
            echo "OIDC OK — PyPI minted an ephemeral token; this workflow's publisher is configured."
          else
            echo "No matching publisher for THIS workflow (expected unless you registered verify-oidc.yml):"
            echo "$resp" | jq -c '.errors' 2>/dev/null || echo "$resp"
          fi
