<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Bookwright — Spec-driven authoring toolkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1426"/>
      <stop offset="55%" stop-color="#241a3a"/>
      <stop offset="100%" stop-color="#10243a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c879"/>
      <stop offset="100%" stop-color="#e98c6b"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf7ef"/>
      <stop offset="100%" stop-color="#e7ddca"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>

  <!-- subtle grid of "plain text" lines, evoking source-of-truth -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <line x1="0" y1="64" x2="1280" y2="64"/>
    <line x1="0" y1="128" x2="1280" y2="128"/>
    <line x1="0" y1="192" x2="1280" y2="192"/>
    <line x1="0" y1="256" x2="1280" y2="256"/>
  </g>

  <!-- glow behind the emblem -->
  <circle cx="190" cy="160" r="96" fill="url(#ink)" opacity="0.18" filter="url(#soft)"/>

  <!-- open book emblem -->
  <g transform="translate(110,108)">
    <path d="M8 14 C40 0 96 0 80 18 L80 92 C96 76 40 76 8 92 Z" fill="url(#page)"/>
    <path d="M152 14 C120 0 64 0 80 18 L80 92 C64 76 120 76 152 92 Z" fill="url(#page)"/>
    <path d="M80 18 L80 92" stroke="#241a3a" stroke-opacity="0.35" stroke-width="3"/>
    <!-- text lines on the pages -->
    <g stroke="#241a3a" stroke-opacity="0.30" stroke-width="3" stroke-linecap="round">
      <line x1="22" y1="30" x2="66" y2="24"/>
      <line x1="22" y1="44" x2="66" y2="38"/>
      <line x1="22" y1="58" x2="60" y2="53"/>
      <line x1="94" y1="24" x2="138" y2="30"/>
      <line x1="94" y1="38" x2="138" y2="44"/>
      <line x1="94" y1="53" x2="132" y2="58"/>
    </g>
    <!-- quill -->
    <path d="M150 -6 C120 18 104 46 96 78 C112 70 134 50 150 18 Z" fill="url(#ink)"/>
    <line x1="150" y1="-6" x2="100" y2="74" stroke="#241a3a" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- wordmark -->
  <text x="360" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#fbf7ef">Bookwright</text>
  <text x="362" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#c9b8e0" letter-spacing="0.5">Spec-driven authoring toolkit for novels, essays &amp; memoirs.</text>

  <!-- tagline chips -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <g transform="translate(362,238)">
      <rect width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="url(#ink)" stroke-opacity="0.5"/>
      <text x="22" y="26" fill="#f5c879">plain text</text>
    </g>
    <g transform="translate(548,238)">
      <rect width="180" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="url(#ink)" stroke-opacity="0.5"/>
      <text x="22" y="26" fill="#f5c879">git-versioned</text>
    </g>
    <g transform="translate(744,238)">
      <rect width="220" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="url(#ink)" stroke-opacity="0.5"/>
      <text x="22" y="26" fill="#f5c879">agent-authored</text>
    </g>
  </g>
</svg>
