<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Pipeline de destilación: constitution, bible, outline, scenes y draft en orden; rama opcional de investigación con research y verify para obra basada en hechos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1426"/>
      <stop offset="55%" stop-color="#241a3a"/>
      <stop offset="100%" stop-color="#10243a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c879"/>
      <stop offset="100%" stop-color="#e98c6b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5c879"/>
    </marker>
    <marker id="arrowc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e98c6b"/>
    </marker>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <line x1="0" y1="90" x2="1280" y2="90"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="270" x2="1280" y2="270"/>
  </g>

  <text x="40" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#fbf7ef">Pipeline de destilación</text>
  <text x="40" y="78" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#c9b8e0">cada paso se funda en el anterior — cada caja es un Agent Skill</text>

  <!-- main chain: 5 chips -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" font-weight="700">
    <g transform="translate(40,120)">
      <rect width="218" height="56" rx="28" fill="#ffffff" fill-opacity="0.06" stroke="url(#ink)" stroke-opacity="0.6"/>
      <text x="109" y="36" text-anchor="middle" fill="#f5c879">/constitution</text>
    </g>
    <g transform="translate(296,120)">
      <rect width="158" height="56" rx="28" fill="#ffffff" fill-opacity="0.06" stroke="url(#ink)" stroke-opacity="0.6"/>
      <text x="79" y="36" text-anchor="middle" fill="#f5c879">/bible</text>
    </g>
    <g transform="translate(492,120)">
      <rect width="178" height="56" rx="28" fill="#ffffff" fill-opacity="0.06" stroke="url(#ink)" stroke-opacity="0.6"/>
      <text x="89" y="36" text-anchor="middle" fill="#f5c879">/outline</text>
    </g>
    <g transform="translate(708,120)">
      <rect width="170" height="56" rx="28" fill="#ffffff" fill-opacity="0.06" stroke="url(#ink)" stroke-opacity="0.6"/>
      <text x="85" y="36" text-anchor="middle" fill="#f5c879">/scenes</text>
    </g>
    <g transform="translate(916,120)">
      <rect width="158" height="56" rx="28" fill="#ffffff" fill-opacity="0.10" stroke="url(#ink)" stroke-opacity="0.85"/>
      <text x="79" y="36" text-anchor="middle" fill="#f5c879">/draft</text>
    </g>
  </g>
  <text x="1010" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#c9b8e0" text-anchor="middle">produce prosa</text>

  <!-- main arrows -->
  <g stroke="#f5c879" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="262" y1="148" x2="292" y2="148"/>
    <line x1="458" y1="148" x2="488" y2="148"/>
    <line x1="674" y1="148" x2="704" y2="148"/>
    <line x1="882" y1="148" x2="912" y2="148"/>
  </g>

  <!-- optional research lane -->
  <rect x="40" y="220" width="1034" height="118" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#e98c6b" stroke-opacity="0.45" stroke-dasharray="3 7"/>
  <text x="60" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e98c6b">obra basada en hechos — opcional, se enciende con [research]</text>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" font-weight="700">
    <g transform="translate(60,264)">
      <rect width="190" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#e98c6b" stroke-opacity="0.6"/>
      <text x="95" y="33" text-anchor="middle" fill="#f5c879">/research</text>
    </g>
    <g transform="translate(820,264)">
      <rect width="170" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#e98c6b" stroke-opacity="0.6"/>
      <text x="85" y="33" text-anchor="middle" fill="#f5c879">/verify</text>
    </g>
  </g>
  <text x="430" y="285" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c9b8e0">anclas que restringen la ficción</text>
  <text x="430" y="306" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9a8bb5">pre-draft documenta · post-draft contrasta</text>

  <!-- research lane internal arrow -->
  <line x1="252" y1="290" x2="816" y2="290" stroke="#e98c6b" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="2 6" fill="none" marker-end="url(#arrowc)"/>
  <!-- verify checks the draft (up arrow) -->
  <path d="M905 264 C905 220 995 210 995 180" stroke="#e98c6b" stroke-width="2" stroke-opacity="0.6" fill="none" stroke-dasharray="2 6" marker-end="url(#arrowc)"/>
</svg>
